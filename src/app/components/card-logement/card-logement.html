
<div class="max-w-sm rounded-xl overflow-hidden shadow-lg bg-white border border-gray-200">
  <img class="w-full h-48 object-cover" [src]="infologement.image" alt="Image du logement">
  <div class="p-5">
    <div class="flex justify-between items-center mb-2">
      <span class="text-blue-600 font-bold uppercase text-xs tracking-widest">{{ infologement.type }}</span>
      <span class="text-gray-900 font-bold">{{ infologement.prix }} FCFA</span>
    </div>
    <h2 class="text-xl font-bold text-gray-800 mb-2">{{ infologement.nom }}</h2>
    <p class="text-gray-600 text-sm">📍 {{ infologement.quartier }}, {{ infologement.ville }}</p>

    <button class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
      Voir les détails
    </button>
  </div>
</div>
